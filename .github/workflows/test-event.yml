name: Test AM event handler

on:
  push:
    branches:
      - diagnose/event-runtime
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check launchevent.js
      - name: Run mocked Outlook compose tests
        run: node tests/launchevent.test.cjs
